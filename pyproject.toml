[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "farmout"
version = "0.1.0"
description = "Hand work to the AI subscriptions you already pay for (Codex, Gemini via Antigravity, GitHub Copilot, a second Claude account, local models): sessions, parallel review and races, pipelines. A CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jay Pokale" }]
keywords = ["mcp", "mcp-server", "claude-code", "codex", "gemini", "antigravity", "copilot", "multi-agent", "code-review", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JayPokale/farmout"
Issues = "https://github.com/JayPokale/farmout/issues"
Changelog = "https://github.com/JayPokale/farmout/blob/main/CHANGELOG.md"

[project.scripts]
farmout = "farmout.cli:main"

[tool.setuptools]
packages = ["farmout"]
