name: release

# Push a vX.Y.Z tag after bumping the version in farmout/__init__.py, pyproject.toml, .claude-plugin/plugin.json and server.json
# and moving CHANGELOG's Unreleased notes under "## [X.Y.Z] - date" (see CONTRIBUTING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests
      - name: Check the tag matches farmout/__init__.py
        run: |
          grep -q "^VERSION = \"${GITHUB_REF_NAME#v}\"" farmout/__init__.py \
            || { echo "tag $GITHUB_REF_NAME does not match the version in farmout/__init__.py"; exit 1; }
      - name: Publish a GitHub Release with this version's CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="[${GITHUB_REF_NAME#v}]" '/^## \[/ { p = index($0, v); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    # PyPI trusted publishing: no token stored here. One-time setup on pypi.org → Publishing → add a pending
    # publisher: project farmout, owner JayPokale, repository farmout, workflow release.yml, environment pypi.
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --quiet build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists this release in the official MCP Registry (registry.modelcontextprotocol.io), signed in with this
    # workflow's GitHub identity: no token stored here. The registry checks that the PyPI package's README carries
    # server.json's name (the `mcp-name` comment at the top of README.md), so this runs after the upload.
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v7
      - name: Wait until PyPI serves this version
        run: |
          for i in $(seq 30); do
            curl -sf "https://pypi.org/pypi/farmout/${GITHUB_REF_NAME#v}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI still doesn't show farmout ${GITHUB_REF_NAME#v} after 5 minutes"; exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download mcp-publisher and verify its signature
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
