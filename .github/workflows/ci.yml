name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu pinned: setup-python has no Python 3.9 build for ubuntu 26.04
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Package installs and runs
        run: |
          python -m pip install --quiet .
          cd "$RUNNER_TEMP" && farmout --version && farmout pipe ls
