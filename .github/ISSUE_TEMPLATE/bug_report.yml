name: Bug report
description: Something in farmout does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command (`farmout run …`, `farmout bench …`, a key in `farmout ui`), or the request you gave Claude Code when it delegated.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `farmout doctor`
      description: It names farmout's version, your Python and each worker CLI's version. Paths in it show your home folder; redact them if you like.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: workers
    attributes:
      label: Workers involved
      options:
        - label: antigravity
        - label: codex
        - label: claude
        - label: copilot
        - label: deepseek
        - label: api
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - uvx
        - pipx
        - pip
        - the Claude Code plugin
        - a git checkout
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: "What the command printed, or `farmout log <session>` for a conversation. Redact tokens and private content before pasting."
      render: text
