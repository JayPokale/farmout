# Questions and "does it work with X" go to Discussions, where answers stay searchable.
# Blank issues stay enabled for doc fixes and packaging reports that fit neither template.
blank_issues_enabled: true
contact_links:
  - name: Question or setup help
    url: https://github.com/JayPokale/modelmux/discussions/categories/q-a
    about: A worker isn't detected, a login fails, or you're unsure how to route a task? Ask here.
  - name: Security vulnerability
    url: https://github.com/JayPokale/modelmux/security/policy
    about: Report privately, for example a way to make a read-only worker write. Never open a public issue for it.
