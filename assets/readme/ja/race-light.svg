<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="Animated illustration of farmout race: four workers each attempt the task in their own git worktree, the test command runs in each, and the attempt that passes with the smallest diff wins; nothing touches your tree until you farmout apply it.">
