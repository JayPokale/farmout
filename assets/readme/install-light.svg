<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="Animated terminal: pipx installs farmout from GitHub, then farmout doctor --live lists the workers it found (antigravity, codex, claude and copilot ready; deepseek and api not set up), the order a task at its limit moves on in, and a live check that each ready worker answers.">
