<text x="36" y="280.1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#f47c7c">  missing  </tspan><tspan fill="#6f8bff" font-weight="700">deepseek     </tspan><tspan fill="#8b8fa3">install DeepSeek Harness (`npm i -g @deepseek-ai/dsh`) and set DEEPSEEK_API_KEY</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4067;0.4167;1.0000" dur="15s" repeatCount="indefinite"/></text>
<text x="36" y="298.6" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#f47c7c">  missing  </tspan><tspan fill="#c9c5bc" font-weight="700">api          </tspan><tspan fill="#8b8fa3">set FARMOUT_API_BASE and FARMOUT_API_MODEL (and FARMOUT_API_KEY if needed)</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4200;0.4300;1.0000" dur="15s" repeatCount="indefinite"/></text>
<text x="36" y="317.1" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#ece8df">4 subscriptions ready. `farmout review` has them all review your change, and a task at its limit</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4400;0.4500;1.0000" dur="15s" repeatCount="indefinite"/></text>
