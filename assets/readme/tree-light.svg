<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" xml:space="preserve" role="img" aria-label="Animated: farmout tree draws a conversation as a graph. Turn 1 on claude branches onto claude:opus, turn 2 branches onto codex, and the main line goes on; farmout ui shows it full-screen, where c continues, b branches off any turn, e asks a turn again differently, / finds words in every answer, Y copies a command whole and C carries on your own CLI session.">
<rect x="0.5" y="0.5" width="879" height="345" rx="14" fill="#f7f5f0" stroke="#dbd6ca"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#15171f">Every conversation is a tree.</text><text x="852" y="40" font-size="13" fill="#575b69" text-anchor="end">branch any turn, onto any model</text>
<rect x="16" y="58" width="848" height="272" rx="10" fill="#08090d" stroke="#22252f"/><path d="M16 90H864" stroke="#22252f"/><circle cx="34" cy="74" r="5" fill="#ff5f57"/><circle cx="50" cy="74" r="5" fill="#febc2e"/><circle cx="66" cy="74" r="5" fill="#28c840"/><text x="440" y="78.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b8fa3" text-anchor="middle">~/app — farmout tree dates</text>
<g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.9333;0.9583;1.0000" dur="12s" repeatCount="indefinite"/>
<text x="40" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#ece8df" font-weight="700">dates</tspan><tspan fill="#8b8fa3"> · claude · 2m ago</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0250;0.0375;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="149" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#f47c7c">● </tspan><tspan fill="#8b8fa3">1  </tspan><tspan fill="#ece8df">Why does parse_date fail on 2024-02-30?</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0583;0.0708;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#8b8fa3">├─╮ </tspan><tspan fill="#8b8fa3">⑂ dates-1 · </tspan><tspan fill="#f47c7c">claude:opus</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1167;0.1292;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="199" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#8b8fa3">│ </tspan><tspan fill="#f47c7c">● </tspan><tspan fill="#8b8fa3">2  </tspan><tspan fill="#ece8df">Try it with a lookup table instead</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1500;0.1625;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="224" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#f47c7c">● </tspan><tspan fill="#8b8fa3">2  </tspan><tspan fill="#ece8df">Fix it and add a test for leap years</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2000;0.2125;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="249" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#8b8fa3">├─╮ </tspan><tspan fill="#8b8fa3">⑂ dates-2 · </tspan><tspan fill="#f2a65a">codex</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2583;0.2708;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="274" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#8b8fa3">│ </tspan><tspan fill="#f2a65a">● </tspan><tspan fill="#8b8fa3">3  </tspan><tspan fill="#ece8df">Same fix, without the new dependency</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2917;0.3042;1.0000" dur="12s" repeatCount="indefinite"/></text>
<text x="40" y="299" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5"><tspan fill="#f47c7c">● </tspan><tspan fill="#8b8fa3">3  </tspan><tspan fill="#ece8df">Now do the same for parse_time</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.3417;0.3542;1.0000" dur="12s" repeatCount="indefinite"/></text>
