<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4042;0.4208;1.0000" dur="12s" repeatCount="indefinite"/><rect x="576" y="160" width="22" height="20" rx="4" fill="#191b23" stroke="#22252f"/><text x="587" y="175" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#ece8df" text-anchor="middle">b</text><text x="608" y="175" font-size="13" fill="#c9c5bc">branch off this turn</text></g>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4250;0.4417;1.0000" dur="12s" repeatCount="indefinite"/><rect x="576" y="186" width="22" height="20" rx="4" fill="#191b23" stroke="#22252f"/><text x="587" y="201" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#ece8df" text-anchor="middle">e</text><text x="608" y="201" font-size="13" fill="#c9c5bc">ask it again, differently</text></g>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4458;0.4625;1.0000" dur="12s" repeatCount="indefinite"/><rect x="576" y="212" width="22" height="20" rx="4" fill="#191b23" stroke="#22252f"/><text x="587" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#ece8df" text-anchor="middle">/</text><text x="608" y="227" font-size="13" fill="#c9c5bc">find in every answer</text></g>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4667;0.4833;1.0000" dur="12s" repeatCount="indefinite"/><rect x="576" y="238" width="22" height="20" rx="4" fill="#191b23" stroke="#22252f"/><text x="587" y="253" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#ece8df" text-anchor="middle">Y</text><text x="608" y="253" font-size="13" fill="#c9c5bc">copy a command, whole</text></g>
<g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4875;0.5042;1.0000" dur="12s" repeatCount="indefinite"/><rect x="576" y="264" width="22" height="20" rx="4" fill="#191b23" stroke="#22252f"/><text x="587" y="279" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#ece8df" text-anchor="middle">C</text><text x="608" y="279" font-size="13" fill="#c9c5bc">carry on your own CLI session</text></g>
